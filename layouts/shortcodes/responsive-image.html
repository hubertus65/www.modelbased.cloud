{{ $src := .Get "src" }}
{{ $image := resources.Get $src }}
{{ if $image }}
  {{ $small := $image.Resize "400x" }}
  {{ $medium := $image.Resize "800x" }}
  {{ $large := $image.Resize "1200x" }}
  {{ $maxwidth := .Get "maxwidth" | default (printf "%dpx" $image.Width) }}
  <div style="max-width: {{ $maxwidth }};">
    <picture>
      <source srcset="{{ $small.RelPermalink }}" media="(max-width: 400px)">
      <source srcset="{{ $medium.RelPermalink }}" media="(max-width: 800px)">
      <img src="{{ $large.RelPermalink }}" alt="{{ .Params.alt }}" style="width: 100%;">
    </picture>
  </div>
{{ end }}
