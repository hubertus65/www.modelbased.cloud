# Blue Energy Library — Image Download Manifest
#
# The blue-energy-library.com WordPress site blocks server-side downloads
# (HTTP 403 on all wp-content/uploads URLs).
# Save each image manually from your browser and place it in:
#
#   static/images/blue-energy/
#
# in your Hugo project root.

DEST_DIR: static/images/blue-energy/

images:
  - local: blue-energy-logo.png
    source: https://www.blue-energy-library.com/wp-content/uploads/2023/12/blue-energy-v3.png
    used_in: content/libraries/blueenergy/index.md (logo, optional)

  - local: blue-energy-hero.jpg
    source: https://www.blue-energy-library.com/wp-content/uploads/2025/06/istock-1682079382-blau-1024x576.jpg
    used_in: (optional hero image, not currently in page)

  - local: blue-energy-schaubild.png
    source: https://www.blue-energy-library.com/wp-content/uploads/2025/10/blue-energy-schaubild.png
    used_in: System overview diagram — displayed in page

  - local: blue-energy-example-home.jpg
    source: https://www.blue-energy-library.com/wp-content/uploads/2025/07/example-c-1-1024x640.jpg
    used_in: Single-family home example — displayed in Simulation Models section

  - local: blue-energy-district.jpg
